version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: intellibank_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellibank_db
      POSTGRES_USER: intellibank_user
      POSTGRES_PASSWORD: strongpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellibank_user -d intellibank_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: intellibank_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://intellibank_user:strongpassword@postgres:5432/intellibank_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/ml
      - reports_data:/app/reports

  # ── Streamlit Frontend ───────────────────────────────────────────────────────
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: intellibank_ui
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://intellibank_user:strongpassword@postgres:5432/intellibank_db
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/ml
      - reports_data:/app/reports

  # ── Nginx Reverse Proxy (Production) ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: intellibank_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - streamlit
      - api
    profiles:
      - production

volumes:
  postgres_data:
  model_artifacts:
  reports_data:

networks:
  default:
    name: intellibank_network
